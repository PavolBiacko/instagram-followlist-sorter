services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: followlist
      POSTGRES_USER: followlist
      POSTGRES_PASSWORD: followlist
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U followlist -d followlist"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://followlist:followlist@db:5432/followlist
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
