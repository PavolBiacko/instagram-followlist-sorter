# Render Blueprint: one Docker web service plus a managed Postgres.
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: followlist-sorter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: followlist-db
          property: connectionString

databases:
  - name: followlist-db
    plan: free
    databaseName: followlist
    user: followlist
